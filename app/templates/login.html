<!DOCTYPE html>
<html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Вход · ЦЕЗАРЬ</title><link rel="stylesheet" href="/static/css/app.css"></head>
<body style="display:grid;place-items:center;min-height:100vh">
<div class="card" style="width:min(420px,92vw);padding:34px;text-align:center">
  <div style="font-size:44px">🏛️</div>
  <h2 style="margin:6px 0 2px">ЦЕЗАРЬ</h2>
  <p style="color:var(--muted);font-size:13px;margin-bottom:22px">Управление стратегических инициатив и проектов</p>
  {% if error %}<p class="badge b-red" style="margin-bottom:14px">{{ error_msg }}</p>{% endif %}
  <a class="btn primary" style="display:inline-block;text-decoration:none" href="/auth/login">Войти через Яндекс ID</a>
  <p style="color:var(--muted);font-size:12px;margin-top:18px">Регистрация закрыта — доступ выдаёт администратор.</p>
  {% if dev %}<hr style="margin:18px 0;border:0;border-top:1px solid var(--line)">
  <form method="get" action="/auth/dev-login" style="display:flex;gap:8px">
    <input name="email" placeholder="email (dev)" style="flex:1">
    <button class="btn">Dev-вход</button></form>{% endif %}
</div></body></html>
