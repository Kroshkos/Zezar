# Конфигурация Alembic для сервиса «ЦЕЗАРЬ».
# Реальный URL БД подставляется в alembic/env.py из app.core.config
# (SQLite строго в /data, путь настраивается через .env) — здесь он только для справки.

[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os

# Fallback-URL (env.py переопределяет его значениями из Settings/.env):
sqlalchemy.url = sqlite:////data/caesar.db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
