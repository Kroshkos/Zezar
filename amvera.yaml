# Конфигурация деплоя на Amvera.
# Документация (проверено):
#   • Хранилище и пути:            https://docs.amvera.ru/applications/storage.html
#       Папка постоянного хранилища Data монтируется в контейнер при ЗАПУСКЕ
#       в путь из run.persistenceMount (по умолчанию /data). Файлы БД SQLite,
#       логи и прочие данные приложения должны писаться по АБСОЛЮТНОМУ пути
#       внутри этой точки (/data/<filename>). Содержимое Code и Artifacts
#       (/app) непостоянно: теряется при пересборке/заморозке проекта.
#   • Python Pip («Секция run»):   https://docs.amvera.ru/applications/environments/python-pip.html
#       Для python/pip допустимые параметры run: scriptName | command
#       (взаимоисключающие), persistenceMount (по умолчанию /data), containerPort.
#       Секция build для python содержит только requirementsPath/кеш — поля
#       diskSizeGb там нет (валидатор отклонял: "unknown fields: diskSizeGb").
#   • Файл конфигурации:           https://docs.amvera.ru/applications/configuration/config-file.html
#
# Соответствие архитектуре сервиса (стандартный путь БД /data/caesar.db):
#   run.persistenceMount: /data  ← точка монтирования постоянного хранилища;
#   DATABASE_PATH можно НЕ задавать — дефолт в app/core/config.py совпадает с
#   ней (важно: в коде используется только абсолютный путь, как требует дока).
#
# Примечания:
#  • Dockerfile остаётся в репозитории для self-hosted VPS (docker run/compose);
#    наличие amvera.yaml означает сборку через toolchain python/pip.
#  • Alembic входит в requirements.txt; схема создаётся приложением в lifespan
#    (create_all идемпотентен). Точечный запуск миграций — `alembic upgrade head`.
#  • PYTHONPATH корня репозитория достаточно для импортов app/modules/integrations.
#  • Переменные окружения (SECRET_KEY, YANDEX_*, TELEGRAM_* и др.) задаются в
#    панели Amvera: раздел приложения → «Переменные и секреты» (не в git!).
#    Полный список — docs/DEPLOY.md, раздел 10.

meta:
  environment: python
  toolchain:
    name: pip
    version: "3.12"

run:
  # ASGI-рецепт из документации Amvera (FastAPI). Команда запускается из /app.
  command: uvicorn --host 0.0.0.0 --port 8080 --proxy-headers --forwarded-allow-ips '*' app.main:app
  containerPort: 8080
  # Постоянное хранилище (папка Data) монтируется сюда при каждом запуске
  # контейнера и НЕ очищается при пересборках. Путь БД: /data/caesar.db.
  persistenceMount: /data
