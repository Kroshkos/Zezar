services:
  caesar:
    build: .
    image: caesar:latest
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      PORT: 8000
      # Системные часы контейнера — Москва (логи, time.strftime); бизнес-логика
      # приложения использует фиксированное смещение MSK из app/core/timezone.py.
      TZ: Europe/Moscow
      TRUST_PROXY_HEADERS: "true"
      ENVIRONMENT: production
      DATA_DIR: /data
      DATABASE_PATH: /data/caesar.db
      # Секреты — только через .env рядом с compose-файлом (не коммитить!)
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY обязателен}
      # Единственный контур входа — логин + пароль. Администратор задаётся здесь.
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD обязателен (пароль администратора)}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_NOTIFY_ENABLED: ${TELEGRAM_NOTIFY_ENABLED:-true}
      YANDEX_CAL_ENABLED: ${YANDEX_CAL_ENABLED:-true}
      SYNC_INTERVAL_SECONDS: ${SYNC_INTERVAL_SECONDS:-300}
      WORKERS_ENABLED: "true"
      DEV_LOGIN_ENABLED: "false"
      SEED_DEMO_DATA: "false"
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
    volumes:
      # SQLite строго в /data — данные переживают пересоздание контейнера
      - caesar-data:/data
    # Для продакшена добавьте reverse-proxy с TLS перед этим сервисом (nginx/traefik)

volumes:
  caesar-data:
