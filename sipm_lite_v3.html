<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Цезарь — Управление стратегических инициатив и проектов</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/inter@5/index.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/manrope@5/index.css">
<style>
:root{
  --bg:#f4f6fb; --panel:#fff; --ink:#0f172a; --muted:#64748b; --line:#e6eaf2;
  --brand:#4f46e5; --brand2:#7c3aed; --gold:#f0b429;
  --rad:16px;
  --shadow:0 1px 2px rgba(15,23,42,.05),0 14px 34px -14px rgba(15,23,42,.16);
  --grad:linear-gradient(135deg,#4f46e5 0%,#7c3aed 100%);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--ink);font-size:14px}
h1,h2,h3,.brand b{font-family:'Manrope','Inter',sans-serif}
button{font-family:inherit;cursor:pointer}
button:disabled{opacity:.5;cursor:not-allowed}
input,select,textarea{font-family:inherit;font-size:14px;width:100%;padding:10px 13px;border:1px solid #dbe2ee;border-radius:11px;background:#fff;color:var(--ink);outline:none;transition:.15s}
input:focus,select:focus,textarea:focus{border-color:#818cf8;box-shadow:0 0 0 3px rgba(99,102,241,.16)}
textarea{resize:vertical}
label{display:block;font-size:11.5px;font-weight:700;color:var(--muted);margin:13px 0 5px;text-transform:uppercase;letter-spacing:.6px}
.app{display:flex;min-height:100vh}
.sidebar{width:272px;min-width:272px;background:radial-gradient(900px 500px at -20% -10%,#26344f 0%,transparent 55%),linear-gradient(180deg,#0f172a,#0b1120);color:#cfd6e6;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.brand{display:flex;gap:13px;align-items:center;padding:24px 20px;border-bottom:1px solid rgba(255,255,255,.07)}
.brand .tile{width:46px;height:46px;border-radius:14px;background:linear-gradient(135deg,#f5c542,#d98e04);display:flex;align-items:center;justify-content:center;font-size:23px;box-shadow:0 10px 22px -8px rgba(240,180,41,.6);flex-shrink:0}
.brand b{font-size:19px;letter-spacing:3px;color:#fff;display:block}
.brand span{font-size:10.5px;color:#8ea0bf;letter-spacing:.3px;display:block;margin-top:2px}
nav{flex:1;padding:16px 13px;overflow:auto}
.nv{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:none;border:0;color:#93a3bd;padding:10px 14px;border-radius:12px;font-size:13.5px;font-weight:600;margin-bottom:3px;transition:.16s}
.nv:hover{background:rgba(255,255,255,.06);color:#e2e8f0}
.nv.on{background:linear-gradient(90deg,rgba(99,102,241,.28),rgba(99,102,241,.06));color:#fff;box-shadow:inset 3px 0 0 #818cf8}
.nv .cnt{margin-left:auto;background:rgba(255,255,255,.1);font-size:11px;font-weight:700;padding:2px 9px;border-radius:99px}
.side-foot{padding:15px;border-top:1px solid rgba(255,255,255,.07);display:grid;gap:8px}
.side-foot button{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);color:#c3cee0;padding:9px;border-radius:11px;font-size:12.5px;font-weight:600;transition:.15s}
.side-foot button:hover{background:rgba(255,255,255,.12);color:#fff}
.hint{font-size:10.5px;color:#5c6b88;text-align:center;margin-top:2px}
main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;padding:26px 32px 14px;flex-wrap:wrap}
.topbar h1{font-size:26px;font-weight:800;letter-spacing:-.4px}
.topbar .sub{color:var(--muted);font-size:13px;margin-top:4px}
.content{padding:8px 32px 56px;flex:1}
.anim{animation:fadeUp .28s ease}
@keyframes fadeUp{from{opacity:0;transform:translateY(9px)}}
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:#fff;color:var(--ink);padding:9px 16px;border-radius:12px;font-size:13.5px;font-weight:700;transition:.18s}
.btn:hover{transform:translateY(-1px);box-shadow:0 8px 18px -8px rgba(15,23,42,.25)}
.btn.primary{background:var(--grad);border:0;color:#fff;box-shadow:0 10px 20px -9px rgba(79,70,229,.6)}
.btn.gold{background:linear-gradient(135deg,#f5c542,#e09c0b);border:0;color:#3d2c00;box-shadow:0 8px 18px -8px rgba(224,156,11,.55)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.danger{color:var(--red);border-color:#fecaca;background:#fff5f5}
.btn.sm{padding:6px 12px;font-size:12.5px;border-radius:10px}
.badge{display:inline-block;padding:4px 11px;border-radius:99px;font-size:11.5px;font-weight:800;white-space:nowrap}
.b-green{background:#e5f7ec;color:#15803d}.b-blue{background:#e7efff;color:#1d4ed8}
.b-red{background:#feecec;color:#b91c1c}.b-amber{background:#fef3dd;color:#b45309}
.b-purple{background:#f1eafe;color:#6d28d9}.b-gray{background:#eef1f6;color:#5b6474}
.b-cyan{background:#e0f5f9;color:#0e7490}.b-gold{background:#fbf3d7;color:#92700c}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--rad);box-shadow:var(--shadow)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:16px}
.pad{padding:20px}
.empty{padding:56px 20px;text-align:center;color:var(--muted)}
.empty div{font-size:44px;margin-bottom:10px;opacity:.55}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:4px 0 14px}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 14px;font-size:12.5px;font-weight:700;color:var(--muted);transition:.16s}
.chip:hover{border-color:#c3cee0}
.chip.on{background:var(--grad);color:#fff;border-color:transparent;box-shadow:0 6px 14px -7px rgba(79,70,229,.55)}
table.tbl{width:100%;border-collapse:collapse}
.tbl th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.7px;color:#94a3b8;padding:12px 14px;border-bottom:1px solid var(--line);font-weight:800}
.tbl th.srt{cursor:pointer;user-select:none;white-space:nowrap}
.tbl th.srt:hover{color:#4f46e5}
.tbl td{padding:12px 14px;border-bottom:1px solid #eef2f8;vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl tr:hover td{background:#f8faff}
.tbl .nm{font-weight:700}
.tbl .sub{font-size:12px;color:var(--muted);margin-top:3px}
.icobtn{border:0;background:none;font-size:15px;padding:5px 6px;border-radius:8px;opacity:.75}
.icobtn:hover{background:#eef2f9;opacity:1}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:15px;margin-bottom:20px}
.stat{padding:20px;position:relative;overflow:hidden}
.sic{width:42px;height:42px;border-radius:13px;display:flex;align-items:center;justify-content:center;font-size:20px;margin-bottom:13px}
.stat .v{font-size:26px;font-weight:800;letter-spacing:-.6px;font-family:'Manrope',sans-serif}
.stat .l{font-size:12px;color:var(--muted);margin-top:3px;font-weight:600}
.pbar{height:8px;background:#edf1f8;border-radius:99px;overflow:hidden}
.pbar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#f0b429,#f5c542)}
.pbar.blue i{background:linear-gradient(90deg,#6366f1,#4f46e5)}
.pbar.green i{background:linear-gradient(90deg,#34d399,#16a34a)}
.link-chips{display:flex;flex-wrap:wrap;gap:6px}
.lchip{font-size:11.5px;background:#f3f6fc;border:1px solid #e4eaf5;border-radius:8px;padding:4px 9px;color:#3d4a63;font-weight:600}
.lchip b{color:#312e81}
.overlay{position:fixed;inset:0;background:rgba(15,23,42,.52);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;z-index:90;animation:fade .18s}
.modal{background:#fff;border-radius:20px;width:min(680px,94vw);max-height:92vh;overflow:auto;box-shadow:0 30px 80px -20px rgba(10,18,38,.5);animation:pop .22s}
.modal.wide{width:min(960px,96vw)}
.modal-head{display:flex;justify-content:space-between;align-items:center;padding:20px 24px;border-bottom:1px solid var(--line);position:sticky;top:0;background:rgba(255,255,255,.94);backdrop-filter:blur(6px);z-index:2}
.modal-head h3{font-size:17px}
.modal-body{padding:8px 24px 24px}
.modal-foot{display:flex;justify-content:flex-end;gap:10px;margin-top:24px;padding-top:16px;border-top:1px solid var(--line)}
.x{border:0;background:#f1f4f9;width:34px;height:34px;border-radius:10px;font-size:15px}
.x:hover{background:#e4e9f2}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}
.frow3{display:grid;grid-template-columns:1fr 1fr auto;gap:12px;align-items:end}
.radio-row{display:flex;gap:20px;margin-top:6px}
.radio-row label{display:flex;gap:7px;align-items:center;margin:0;text-transform:none;font-size:13.5px;color:var(--ink);cursor:pointer;font-weight:600}
.radio-row input{width:auto}
.kv{display:grid;grid-template-columns:170px 1fr;gap:7px 12px;font-size:13.5px;margin:12px 0}
.kv b{color:var(--muted);font-weight:600}
.mini-add{background:#f7f9fd;border:1px dashed #cfd8e8;border-radius:14px;padding:16px;margin-top:14px}
.row-item{display:flex;align-items:center;gap:10px;padding:11px 13px;border:1px solid var(--line);border-radius:13px;margin-bottom:8px;background:#fff}
.row-item .ri-body{flex:1;min-width:0}
.row-item .ri-t{font-weight:700}
.row-item .ri-s{font-size:12px;color:var(--muted);margin-top:3px}
.row-item.overdue{border-color:#fecaca;background:#fffafa}
.grp-head{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:800;color:#312e81;text-transform:uppercase;letter-spacing:.5px;margin:14px 0 8px;padding:7px 10px;background:#f1f4ff;border-radius:9px}
.ed2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.msteps{display:flex;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.mstep{flex:1;min-width:210px;display:flex;gap:11px;align-items:center;padding:13px 16px}
.mstep .n{width:32px;height:32px;border-radius:50%;background:#eef1f6;color:#5b6474;font-weight:800;display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0}
.mstep.done .n{background:linear-gradient(135deg,#34d399,#16a34a);color:#fff}
.mstep .t{font-weight:800;font-size:13px}
.mstep .s{font-size:11.5px;color:var(--muted)}
/* workflow canvas */
.wfbox{position:relative;border:1px solid var(--line);border-radius:14px;background:radial-gradient(#d9dfec 1px,transparent 1px);background-size:22px 22px;background-color:#fbfcfe;overflow:auto;margin-top:12px}
.wfnode{position:absolute;min-width:150px;max-width:200px;background:#fff;border:2px solid #c9d2e3;border-radius:11px;padding:8px 10px;font-size:12px;cursor:grab;box-shadow:0 4px 10px rgba(15,23,42,.08);user-select:none}
.wfnode.active{border-color:#6366f1;box-shadow:0 0 0 3px rgba(99,102,241,.18)}
.wfnode.done{border-color:#22c55e;background:#f2fdf6}
.wfnode.rejected{border-color:#ef4444;background:#fef5f5}
.wfnode.branch{border-style:dashed}
.wfnode.sel{outline:3px solid #f0b429}
.wfnode .t{font-weight:700;line-height:1.25}
.wfnode .s{font-size:10.5px;color:var(--muted);margin-top:2px}
/* ===== Приоритет-2030: рабочая таблица (стиль референса) ===== */
.p30{--s-bg:#f5f7f7;--s-surface:#fff;--s-text:#24322d;--s-muted:#64716b;--s-line:#dce3df;--s-accent:#237454;--s-pale:#eaf4ee;--s-head:#f0f5f2;
  background:var(--s-bg);border:1px solid var(--s-line);border-radius:14px;overflow:hidden;color:var(--s-text);font-size:13.5px}
.p30-top{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:16px 24px;background:var(--s-surface);flex-wrap:wrap}
.p30-brand{display:flex;align-items:center;gap:12px}
.p30-ico{width:38px;height:38px;border-radius:10px;background:var(--s-pale);border:1px solid var(--s-line);display:flex;align-items:center;justify-content:center;font-size:19px}
.p30-brand strong{font-size:16px;font-weight:800}
.p30-brand strong span{font-weight:500;color:var(--s-muted)}
.p30-brand small{display:block;color:var(--s-muted);font-size:12px;margin-top:2px}
.p30-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.p30 .pbtn{border:1px solid var(--s-line);background:var(--s-surface);color:var(--s-text);border-radius:7px;padding:8px 13px;min-height:36px;font-size:13px;font-weight:600;transition:.12s}
.p30 .pbtn:hover{background:var(--s-pale);border-color:var(--s-accent)}
.p30 .pbtn.primary{background:#237454;color:#fff;border-color:#237454}
.p30 .pbtn.primary:hover{background:#185b40}
.p30-note{background:var(--s-pale);border-left:3px solid var(--s-accent);padding:10px 16px;margin:12px 24px;color:var(--s-text);font-size:12.5px;border-radius:0 6px 6px 0}
.p30-tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;padding:0 24px 14px}
.p30-tools input,.p30-tools select{width:auto;border:1px solid var(--s-line);border-radius:7px;padding:8px 12px;font-size:13px;background:var(--s-surface);color:var(--s-text)}
.p30-chips{display:flex;gap:7px;flex-wrap:wrap;align-items:center}
.p30-chip{border:1px solid var(--s-line);background:var(--s-surface);border-radius:999px;padding:6px 13px;font-size:12.5px;font-weight:600;color:var(--s-muted)}
.p30-chip:hover{border-color:var(--s-accent)}
.p30-chip.on{background:var(--s-accent);border-color:var(--s-accent);color:#fff}
.p30-scroll{overflow:auto;max-height:68vh;border-top:1px solid var(--s-line)}
.p30-table{border-collapse:separate;border-spacing:0;width:max-content;min-width:100%;font-size:13px}
.p30-table th,.p30-table td{border-right:1px solid var(--s-line);border-bottom:1px solid var(--s-line);padding:10px 12px;vertical-align:top;text-align:left;background:var(--s-surface);font-weight:400}
.p30-table th{position:sticky;top:0;z-index:3;background:var(--s-head);height:64px;vertical-align:middle;font-weight:700;white-space:nowrap;font-size:12px}
.p30-table th small{display:block;font-size:10.5px;font-weight:500;color:var(--s-muted);line-height:1.3;margin-top:4px}
.p30-table th.srt{cursor:pointer;user-select:none}
.p30-table th.srt:hover{color:var(--s-accent)}
.p30-table td{white-space:pre-line;overflow-wrap:anywhere}
.p30-table tbody tr:hover td{background:var(--s-bg)}
.p30-idx{position:sticky;left:0;width:46px;min-width:46px;z-index:2;text-align:center!important;font-size:12px;color:var(--s-muted);background:var(--s-head)!important}
.p30-table th.p30-idx{z-index:5}
.p30-name{position:sticky;left:46px;z-index:2;box-shadow:2px 0 0 var(--s-line);min-width:250px;max-width:330px}
.p30-table th.p30-name{z-index:5;background:var(--s-head)}
.p30-name .nm{font-weight:700;cursor:pointer;line-height:1.35}
.p30-name .nm:hover{color:var(--s-accent)}
.p30-money{font-variant-numeric:tabular-nums;text-align:right!important;white-space:nowrap!important}
.p30-mark{display:inline-block;font-size:12px;border:1px solid var(--s-line);padding:3px 9px;line-height:1.4;border-radius:5px;color:var(--s-muted);background:var(--s-bg);white-space:nowrap;cursor:pointer}
.p30-mark.yes{background:var(--s-pale);color:var(--s-accent);border-color:var(--s-line)}
.p30-mark.mid{background:#eef4ff;color:#2b6cb0;border-color:#d7e3f8}
.p30-mark.no{color:#9a553e;background:#fcf3ed;border-color:#eddfd5}
.p30-mark.plain{cursor:default}
.p30-link{border:0;background:none;padding:0;color:var(--s-accent);font-size:12.5px;font-weight:600;cursor:pointer;text-align:left;font-family:inherit}
.p30-link:hover{text-decoration:underline}
.p30-mini{height:5px;background:#e5ebe7;border-radius:99px;overflow:hidden;margin-top:5px;width:110px}
.p30-mini i{display:block;height:100%;background:var(--s-accent)}
.p30-foot{display:flex;gap:14px;align-items:center;padding:9px 16px;border-top:1px solid var(--s-line);background:var(--s-surface);color:var(--s-muted);font-size:12px;flex-wrap:wrap}
.p30-foot .right{margin-left:auto}
.p30-save{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--s-accent);margin-right:5px}
/* ===== печать ===== */
#printWrap{display:none}
#printWrap.on{display:block;position:fixed;inset:0;background:#e8ebf1;z-index:150;overflow:auto}
.pv-bar{position:sticky;top:0;z-index:5;background:#0f172a;color:#fff;display:flex;align-items:center;gap:12px;padding:12px 22px}
.pv-bar .sp{flex:1}
.paper{background:#fff;max-width:840px;margin:26px auto;padding:46px 54px;box-shadow:0 10px 40px rgba(15,23,42,.2);font-size:12.5px;color:#0f172a;line-height:1.55;font-family:'Inter',sans-serif}
.paper.min{padding:10mm 11mm}
.paper .phead{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:3px double #1e293b;padding-bottom:12px;margin-bottom:18px;gap:16px}
.paper .porg{font-weight:800;font-size:13px;text-transform:uppercase;letter-spacing:1.4px}
.paper .pdep{font-size:12px;color:#334155;margin-top:3px}
.paper .pnum{text-align:right;font-size:11px;color:#475569;white-space:nowrap}
.paper h1{font-size:18px;text-align:center;margin:16px 0 4px;text-transform:uppercase;letter-spacing:3px;font-weight:800}
.paper .ph2{border-left:4px solid var(--brand);padding-left:10px;font-weight:800;text-transform:uppercase;font-size:12.5px;margin:20px 0 9px;letter-spacing:.6px;color:#1e1b4b}
.paper table{width:100%;border-collapse:collapse;margin:9px 0;font-size:12px}
.paper th{background:#eef2ff;color:#312e81;font-size:10px;text-transform:uppercase;letter-spacing:.5px;border:1px solid #c7d2fe;padding:6px 8px;text-align:left}
.paper td{border:1px solid #cbd5e1;padding:6px 8px;vertical-align:top}
.paper .note{font-size:11px;color:#64748b}
.ag{font-size:9.3pt;line-height:1.4;color:#111}
.ag-org{font-size:8.5pt;color:#444;border-bottom:.6mm solid #222;padding-bottom:1.5mm;margin-bottom:3mm;display:flex;justify-content:space-between;gap:10px}
.ag-title{text-align:center;font-size:15pt;font-weight:800;letter-spacing:2.5px;text-transform:uppercase;margin:1mm 0 .5mm;font-family:'Manrope','Inter',sans-serif}
.ag-sub{text-align:center;font-size:8.5pt;color:#555;margin-bottom:3mm}
.ag-meta{display:grid;grid-template-columns:1fr 1fr 1fr 1.3fr;gap:2.5mm;border:1.6px solid #222;border-radius:2mm;padding:2.6mm;margin-bottom:3mm}
.ag-meta div b{display:block;font-size:7pt;text-transform:uppercase;letter-spacing:1px;color:#666;margin-bottom:.8mm}
.ag-sec{font-weight:800;font-size:10pt;text-transform:uppercase;letter-spacing:1.1px;margin:3.6mm 0 1.6mm;padding:1mm 0 1mm 2.5mm;border-left:2.2mm solid #222;page-break-after:avoid}
.ag-grp{font-weight:800;font-size:9pt;margin:2.6mm 0 1.2mm;padding:1.4mm 2mm;background:#f1f4ff;border-radius:1.5mm;page-break-after:avoid}
.ag-lbl{font-size:7.5pt;text-transform:uppercase;letter-spacing:.8px;color:#555;font-weight:800;margin:2mm 0 1mm}
.ag-line{border-bottom:.35mm solid #888;min-height:6.4mm;margin-top:1.4mm}
.ag-row{display:flex;gap:4mm}
.ag-cell{flex:1}
.ag-tbl{width:100%;border-collapse:collapse;font-size:8pt;margin:1mm 0}
.ag-tbl th,.ag-tbl td{border:.32mm solid #666;padding:1.4mm 1.8mm;text-align:left;vertical-align:top}
.ag-tbl th{background:#efefef;font-size:7.3pt;text-transform:uppercase;letter-spacing:.5px}
.ag-tbl .empty-row td{height:6.6mm}
.ag-tbl tr{page-break-inside:avoid}
.ag-dec{display:flex;gap:2.5mm;margin-bottom:4mm;page-break-inside:avoid}
.ag-dec-h{font-weight:800;font-size:9.5pt;min-width:7mm}
.ag-flow{display:flex;margin:2mm 0 3mm}
.ag-flow .af{flex:1;text-align:center;position:relative;padding:0 1mm}
.ag-flow .af::before{content:"";position:absolute;top:3.2mm;left:-50%;width:100%;border-top:.4mm solid #999}
.ag-flow .af:first-child::before{display:none}

<script>
"use strict";
/* ================= UTILS ================= */

const cut=(s,n)=>String(s||'').length>n?String(s).slice(0,n)+'…':String(s||'');

/* ================= DB ================= */

let state={view:'dash',adminTab:'people',meetEditId:null,meetGroup:'all',meetQ:'',meetSel:[],grpEdit:null,wfKind:null,wfEntId:null,wfSel:null,wfOff:{},

function save(){try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){}}
function defaults(){

    docs:[],softs:[],tasks:[],projects:[],grants:[],schols:[],priority:[],meetings:[],people:[],taskGroups:[],

      {id:uid(),name:'Договорная работа',steps:['Подготовка проекта','Правовая экспертиза','Согласование','Подписание','Исполнение']},
      {id:uid(),name:'Жизненный цикл разработки ПО',steps:['Аналитика и сбор данных','Проектирование','Разработка','Тестирование','Релиз','Сопровождение']}
    ]
  };

const arrOf=x=>Array.isArray(x)?x.slice():[];
function normalizeDB(){
  ['docs','softs','projects'].forEach(k=>{
    db[k].forEach(e=>{(e.steps||[]).forEach(s=>{s.branches=s.branches||[]})});
  });
  db.meetings.forEach(m=>{m.agenda=m.agenda||[];m.decisions=m.decisions||[];m.taskIds=m.taskIds||[]});
  db.tasks.forEach(t=>{t.wf=t.wf||null});
  db.priority.forEach(p=>{if(p.confirmed===undefined)p.confirmed=false});
  if(!Array.isArray(db.taskGroups))db.taskGroups=[];
  db.taskGroups.forEach(g=>{const c=g.criteria||{};g.criteria={projectIds:arrOf(c.projectIds),statuses:arrOf(c.statuses),priorities:arrOf(c.priorities),dues:arrOf(c.dues)}});
  const def=defaults();
  Object.keys(def.statusSets).forEach(k=>{if(!db.statusSets[k])db.statusSets[k]=def.statusSets[k]});
  if(!Array.isArray(db.softTypes)||!db.softTypes.length)db.softTypes=def.softTypes;
}
function load(){
  const base=defaults();
  try{
    const raw=localStorage.getItem(KEY);
    if(raw){const p=JSON.parse(raw);Object.keys(base).forEach(k=>{if(p[k]!==undefined)base[k]=p[k]});db=base;normalizeDB();return}
  }catch(e){}
  db=base;save();
}
/* ================= DICT ================= */

const APPROVED=['approved','paid'];
const COLORS=[['b-gray','Серый'],['b-blue','Синий'],['b-green','Зелёный'],['b-red','Красный'],['b-amber','Янтарный'],['b-purple','Фиолетовый'],['b-cyan','Бирюзовый'],['b-gold','Золотой']];

function stOf(set,key){return (db.statusSets[set]||[]).find(x=>x.key===key)||{label:key||'—',color:'b-gray'}}
function prioOf(key){return (db.prioSet||[]).find(x=>x.key===key)||{label:key||'—',color:'b-gray'}}
function setOpts(set,sel){return (db.statusSets[set]||[]).map(s=>'<option value="'+s.key+'" '+(sel===s.key?'selected':'')+'>'+s.label+'</option>').join('')}
function firstKey(set){return db.statusSets[set]&&db.statusSets[set][0]?db.statusSets[set][0].key:''}
function stUsage(set,key){
  if(set==='project')return db.projects.filter(x=>x.status===key).length;
  if(set==='task')return db.tasks.filter(x=>x.status===key).length;
  if(set==='grant')return db.grants.filter(x=>x.status===key).length;
  if(set==='schol')return db.schols.filter(x=>x.status===key).length;
  if(set==='meet')return db.meetings.filter(x=>x.status===key).length;
  if(set==='prio')return db.tasks.filter(x=>x.priority===key).length;
  return 0;
}
/* ================= HELPERS ================= */
function byId(arr,id){return arr.find(x=>x.id===id)}
function projName(id){const p=byId(db.projects,id);return p?p.title:''}
function taskName(id){const p=byId(db.tasks,id);return p?p.title:''}
function grantName(id){const p=byId(db.grants,id);return p?p.title:''}
function scholName(id){const p=byId(db.schols,id);return p?p.name:''}
function prioName(id){const p=byId(db.priority,id);return p?p.name:''}
function stDateHTML(x){return x&&x.statusDate?'<span style="font-size:11px;color:#94a3b8;font-weight:600">от '+fmt(x.statusDate)+'</span>':''}
function opts(arr,sel,valK,labK){
  valK=valK||'id';labK=labK||'title';
  let h='<option value="">— не выбрано —</option>';
  arr.forEach(x=>{h+='<option value="'+x[valK]+'" '+(sel===x[valK]?'selected':'')+'>'+esc(x[labK])+'</option>'});
  return h;
}
function wfStatus(e){
  if(!e.steps||!e.steps.length)return['Без маршрута','b-gray','progress'];
  if(e.steps.some(s=>s.state==='rejected'))return['Отклонён','b-red','rejected'];
  if(e.steps.every(s=>s.state==='done'))return['Завершён','b-green','done'];
  return['В работе','b-blue','progress'];
}
function docProgress(e){return (e.steps||[]).filter(s=>s.state==='done').length}
function wfProgressLabel(t){
  if(!t||!t.wf)return '';
  const ent=getEnt(t.wf.kind,t.wf.id);
  if(!ent||!ent.steps)return '';
  if(t.wf.branch){
    const st=ent.steps[t.wf.step];const br=st&&(st.branches||[]).find(b=>b.id===t.wf.branch);
    if(!br)return '';const bs=br.steps[t.wf.bstep];
    return 'ветка «'+br.name+'» · «'+(bs?bs.name:'')+'»';
  }
  const s=ent.steps[t.wf.step];
  if(!s)return '';
  const done=ent.steps.filter(x=>x.state==='done').length;
  return '«'+s.name+'» — этап '+(t.wf.step+1)+' из '+ent.steps.length+' (выполнено '+done+')';
}

function toast(msg){
  const t=document.createElement('div');t.className='toast';t.textContent=msg;document.body.appendChild(t);

/* ================= ФИЛЬТРЫ И СОРТИРОВКА ================= */

function sortBar(mod,fields){
  const s=state.sort[mod]||{key:fields[0][0],dir:1};
  let h='<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px;padding-top:10px;border-top:1px dashed var(--line)">';
  h+='<span style="font-size:10.5px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.5px">Сортировка</span>';
  h+='<select style="max-width:230px" onchange="setSortSel(\''+mod+'\',this.value)">';

  h+='</select>';
  h+='<button class="btn sm" onclick="setSortDir(\''+mod+'\')">'+(s.dir>0?'↑ по возрастанию':'↓ по убыванию')+'</button>';
  h+='</div>';
  return h;
}
function applySort(list,mod,g){
  const s=state.sort[mod];if(!s||!g[s.key])return list;
  const f=g[s.key];
  return list.slice().sort((a,b)=>{
    const va=f(a),vb=f(b);let r;
    if(typeof va==='number'||typeof vb==='number')r=(+va||0)-(+vb||0);
    else r=String(va==null?'':va).localeCompare(String(vb==null?'':vb),'ru');
    return r*s.dir;
  });
}
/* ================= MODALS ================= */

function openModal(title,body,submitLabel,onSubmit,wide){
  closeModal();
  const ov=document.createElement('div');ov.className='overlay';
  ov.innerHTML='<div class="modal '+(wide?'wide':'')+'">'
    +'<div class="modal-head"><h3>'+title+'</h3><button type="button" class="x">✕</button></div>'
    +'<form class="modal-body">'+body+'<div class="modal-foot">'
    +'<button type="button" class="btn ghost mcancel">Отмена</button>'
    +(submitLabel?'<button class="btn primary" type="submit">'+submitLabel+'</button>':'')
    +'</div></form></div>';
  document.body.appendChild(ov);
  ov.querySelector('.x').onclick=closeModal;
  ov.querySelector('.mcancel').onclick=closeModal;
  ov.addEventListener('mousedown',e=>{if(e.target===ov)closeModal()});
  const form=ov.querySelector('form');
  form.addEventListener('submit',e=>{
    e.preventDefault();
    const o={};new FormData(e.target).forEach((v,k)=>{o[k]=v});
    if(onSubmit)onSubmit(o);
  });
  form.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.tagName!=='TEXTAREA')e.preventDefault()});
  return ov;
}

  const ent=getEnt(kind,entId);if(!ent)return;

    status:s.state==='active'?'progress':(s.state==='done'?'done':'new'),statusDate:todayISO(),priority:'medium',deadline:s.deadline||'',
    projectId:entProjectId(kind,ent),
    desc:'Автозадача этапа «'+s.name+'». Завершение задачи закрывает этап и переводит маршрут на следующий.',
    wf:{kind:kind,id:entId,step:i}};

function createBranchTask(kind,entId,si,bi,bsi){
  const ent=getEnt(kind,entId);if(!ent)return;
  const br=ent.steps[si].branches[bi];const bs=br.steps[bsi];
  const t={id:uid(),title:ent.title+' — ветка «'+br.name+'»: '+bs.name,executor:entExecutor(kind,ent),
    status:bs.state==='active'?'progress':(bs.state==='done'?'done':'new'),statusDate:todayISO(),priority:'medium',deadline:bs.deadline||'',
    projectId:entProjectId(kind,ent),desc:'Автозадача этапа ветки «'+br.name+'».',
    wf:{kind:kind,id:entId,step:si,branch:br.id,bstep:bsi}};
  db.tasks.push(t);bs.taskId=t.id;
}
function syncTaskFromStep(s){
  const t=s.taskId?byId(db.tasks,s.taskId):null;if(!t)return;
  let ns=t.status;
  if(s.state==='done')ns='done';else if(s.state==='active')ns='progress';else if(s.state==='pending')ns='new';
  if(ns!==t.status){t.status=ns;t.statusDate=todayISO()}
}
function checkBranchDone(ent,si,bi){
  const step=ent.steps[si];if(!step)return;
  const br=(step.branches||[])[bi];if(!br)return;
  if(!br.steps.length||!br.steps.every(s=>s.state==='done'))return;
  if(br.mode==='closeParent'){if(step.state!=='done'){step.state='done';step.date=todayISO();syncTaskFromStep(step)}}
  else if(br.mode==='closeStage'){const tg=ent.steps[br.targetStep||0];if(tg&&tg.state!=='done'){tg.state='done';tg.date=todayISO();syncTaskFromStep(tg)}}
}
function syncWfFromTask(t){
  if(!t||!t.wf)return;
  const ent=getEnt(t.wf.kind,t.wf.id);if(!ent||!ent.steps)return;
  if(t.wf.branch){
    const step=ent.steps[t.wf.step];if(!step)return;
    const bi=(step.branches||[]).findIndex(b=>b.id===t.wf.branch);if(bi<0)return;
    const br=step.branches[bi];const bs=br.steps[t.wf.bstep];if(!bs)return;
    if(t.status==='done'){if(bs.state!=='done'){bs.state='done';bs.date=todayISO()}checkBranchDone(ent,t.wf.step,bi)}
    else if(bs.state==='done'){bs.state=t.status==='progress'?'active':'pending';bs.date=''}
    return;
  }
  const s=ent.steps[t.wf.step];if(!s)return;
  if(t.status==='done'){
    if(s.state!=='done'){s.state='done';s.date=todayISO()}
    const nxt=ent.steps[t.wf.step+1];
    if(nxt&&nxt.state!=='done'&&nxt.state!=='rejected'){
      nxt.state='active';
      const nt=nxt.taskId?byId(db.tasks,nxt.taskId):null;
      if(nt&&nt.status!=='done'){nt.status='progress';nt.statusDate=todayISO()}
    }
  } else if(s.state==='done'){
    s.state=t.status==='progress'?'active':'pending';s.date='';
  }
}
function reindexAll(ent){
  ent.steps.forEach((s,i)=>{
    const t=s.taskId?byId(db.tasks,s.taskId):null;if(t&&t.wf)t.wf.step=i;
    (s.branches||[]).forEach(br=>{
      br.steps.forEach((bs,bsi)=>{const bt=bs.taskId?byId(db.tasks,bs.taskId):null;if(bt&&bt.wf){bt.wf.step=i;bt.wf.bstep=bsi}});
    });
  });
}
function collectWfTaskIds(ent){

function buildStepsFromForm(fd){

function wfLayout(ent){
  const nodes=[],edges=[];
  (ent.steps||[]).forEach((s,i)=>{
    const key='s'+i;
    nodes.push({key:key,si:i,label:s.name,state:s.state,x:30+i*215,y:30,branch:false,deadline:s.deadline,sub:'этап '+(i+1)+' из '+ent.steps.length+' · '+(STEP_ST[s.state]||[''])[0]});
    if(i>0)edges.push({a:'s'+(i-1),b:key,dashed:false});
  });
  (ent.steps||[]).forEach((s,i)=>{
    (s.branches||[]).forEach((br,bi)=>{
      const px=30+i*215;
      let prevKey='s'+i;
      br.steps.forEach((bs,bsi)=>{
        const key='s'+i+'b'+bi+'x'+bsi;
        nodes.push({key:key,si:i,bi:bi,bsi:bsi,label:bs.name,state:bs.state,x:px+30+bi*200,y:150+bsi*92,branch:true,deadline:bs.deadline,sub:'🌿 '+br.name+(bsi===0?' · '+(BR_MODES[br.mode]?BR_MODES[br.mode][0]:''):'')});
        edges.push({a:prevKey,b:key,dashed:true});
        prevKey=key;
      });
    });
  });
  return {nodes:nodes,edges:edges};
}
function wfCanvasHTML(kind,ent){
  const lay=wfLayout(ent);

  const off=(state.wfOff[ent.id]||{});

    +'<svg style="position:absolute;left:0;top:0;pointer-events:none;overflow:visible"></svg>';

    const selc=state.wfSel&&state.wfSel.key===n.key?' sel':'';

      +'<div class="t">'+esc(n.label)+'</div>'

function drawEdges(){
  const box=document.getElementById('wfbox');if(!box)return;
  const inner=box.firstChild;const svg=inner.querySelector('svg');
  svg.setAttribute('width',inner.offsetWidth);svg.setAttribute('height',inner.offsetHeight);
  const pos={};
  inner.querySelectorAll('.wfnode').forEach(el=>{pos[el.getAttribute('data-k')]={x:el.offsetLeft,y:el.offsetTop,w:el.offsetWidth,h:el.offsetHeight}});
  let out='';
  (window._wfEdges||[]).forEach(e=>{
    const a=pos[e.a],b=pos[e.b];if(!a||!b)return;
    let x1,y1,x2,y2;
    if(b.y>a.y+12){x1=a.x+a.w/2;y1=a.y+a.h;x2=b.x+b.w/2;y2=b.y}
    else{x1=a.x+a.w;y1=a.y+a.h/2;x2=b.x;y2=b.y+b.h/2}
    out+='<line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="'+(e.dashed?'#94a3b8':'#64748b')+'" stroke-width="2" '+(e.dashed?'stroke-dasharray="6 5"':'')+'/>';
  });
  svg.innerHTML=out;
}
function nodeDown(ev,key){
  if(ev.button!==0)return;
  ev.preventDefault();
  const el=ev.currentTarget;
  const sx=ev.clientX,sy=ev.clientY,ol=el.offsetLeft,ot=el.offsetTop;
  let moved=false;
  function mv(e){moved=true;el.style.left=(ol+e.clientX-sx)+'px';el.style.top=(ot+e.clientY-sy)+'px';drawEdges()}
  function up(){
    document.removeEventListener('mousemove',mv);document.removeEventListener('mouseup',up);
    if(!moved){selectWfNode(key)}
    else{
      if(!state.wfOff[state.wfEntId])state.wfOff[state.wfEntId]={};
      state.wfOff[state.wfEntId][key]={x:el.offsetLeft,y:el.offsetTop};
    }
  }
  document.addEventListener('mousemove',mv);
  document.addEventListener('mouseup',up);
}

function parseKey(key){

function delStep(kind,id,i){
  const ent=getEnt(kind,id);if(!ent)return;
  if(ent.steps.length<=1){toast('Нельзя удалить единственный этап маршрута');return}

function brRenameBranch(kind,id,si,bi,v){

function delBranchStep(kind,id,si,bi,bsi){

function delBranch(kind,id,si,bi){

function deleteProject(id){
  const p=byId(db.projects,id);
  askConfirm('Удалить проект «'+esc(p?p.title:'')+'»? Автозадачи маршрута будут удалены, остальные связи очищены.','Удалить',()=>{
    const proj=byId(db.projects,id);
    const tids=collectWfTaskIds(proj);
    db.tasks=db.tasks.filter(t=>tids.indexOf(t.id)<0);
    db.projects=db.projects.filter(x=>x.id!==id);
    db.tasks.forEach(t=>{if(t.projectId===id)t.projectId=''});
    db.docs.forEach(d=>{if(d.projectId===id)d.projectId=''});
    db.softs.forEach(s=>{if(s.projectId===id)s.projectId=''});
    db.meetings.forEach(m=>{if(m.projectId===id)m.projectId='';m.decisions.forEach(dc=>{if(dc.projectId===id)dc.projectId=''})});
    db.grants.forEach(g=>{if(g.projectId===id)g.projectId=''});
    db.priority.forEach(pp=>{if(pp.projectId===id)pp.projectId=''});
    save();render();toast('Проект удалён');
  });
}

function cycleTask(id){
  const t=byId(db.tasks,id);const arr=db.statusSets.task||[];if(!t||!arr.length)return;
  const i=arr.findIndex(s=>s.key===t.status);
  t.status=arr[(i+1)%arr.length].key;
  t.statusDate=todayISO();
  syncWfFromTask(t);

function deleteTask(id){
  const t=byId(db.tasks,id);
  const warn=t&&t.wf?' Задача привязана к этапу workflow — привязка этапа будет снята.':'';
  askConfirm('Удалить задачу?'+warn,'Удалить',()=>{
    const task=byId(db.tasks,id);
    if(task&&task.wf){
      const ent=getEnt(task.wf.kind,task.wf.id);
      if(ent&&task.wf.branch){
        const stp=ent.steps[task.wf.step];const br=stp&&(stp.branches||[]).find(b=>b.id===task.wf.branch);
        const bs=br&&br.steps[task.wf.bstep];if(bs&&bs.taskId===id)bs.taskId='';
      }else{
        const s=ent&&ent.steps&&ent.steps[task.wf.step];if(s&&s.taskId===id)s.taskId='';
      }
    }
    db.tasks=db.tasks.filter(x=>x.id!==id);
    db.docs.forEach(d=>{if(d.taskId===id)d.taskId=''});
    save();render();toast('Задача удалена');
  });
}

/* ================= ГРУППЫ ЗАДАЧ ================= */
function matchDue(t,du){
  const today=todayISO();
  if(du==='week')return !!t.deadline&&t.deadline>=today&&t.deadline<=dPlus(7);
  if(du==='month')return !!t.deadline&&t.deadline>=today&&t.deadline<=dPlus(30);
  if(du==='overdue')return !!t.deadline&&t.deadline<today&&t.status!=='done';
  return false;
}
function matchGroup(t,g){
  const c=g.criteria||{};
  if(c.projectIds&&c.projectIds.length){if(c.projectIds.indexOf(t.projectId||'')<0)return false}
  if(c.statuses&&c.statuses.length){if(c.statuses.indexOf(t.status)<0)return false}
  if(c.priorities&&c.priorities.length){if(c.priorities.indexOf(t.priority)<0)return false}
  if(c.dues&&c.dues.length){if(!c.dues.some(du=>matchDue(t,du)))return false}
  return true;
}
function grpDesc(g){
  const c=g.criteria||{};const parts=[];
  if(c.projectIds&&c.projectIds.length)parts.push('проекты: '+c.projectIds.map(id=>cut(projName(id),18)).join(', '));
  if(c.statuses&&c.statuses.length)parts.push('статусы: '+c.statuses.map(k=>stOf('task',k).label).join(', '));
  if(c.priorities&&c.priorities.length)parts.push('приоритеты: '+c.priorities.map(k=>prioOf(k).label).join(', '));
  if(c.dues&&c.dues.length)parts.push('срок: '+c.dues.map(d=>d==='week'?'эта неделя':(d==='month'?'этот месяц':'просроченные')).join(', '));
  return parts.length?parts.join(' · '):'все задачи';
}

function groupTasks(list){
  const groups={},order=[];
  list.forEach(t=>{
    let gk,gl;
    if(t.projectId){gk='p_'+t.projectId;gl='🗂 Проект: '+projName(t.projectId)}
    else if(t.wf){const ent=getEnt(t.wf.kind,t.wf.id);gk='w_'+t.wf.id;gl=(t.wf.kind==='doc'?'📁 Документ: ':(t.wf.kind==='soft'?'💻 ПО: ':'🗂 '))+(ent?ent.title:'')}
    else{gk='none';gl='📌 Без привязки'}
    if(!groups[gk]){groups[gk]={label:gl,tasks:[]};order.push(gk)}
    groups[gk].tasks.push(t);
  });
  order.forEach(k=>{
    groups[k].tasks.sort((a,b)=>{
      const wa=a.wf?a.wf.step:9999,wb=b.wf?b.wf.step:9999;
      if(wa!==wb)return wa-wb;
      return (a.deadline||'9999').localeCompare(b.deadline||'9999');
    });
  });
  return order.map(k=>groups[k]);
}

function addAttendee(name){
  const m=curMeet();if(!m)return;
  const arr=splitPeople(m.attendees);
  const i=arr.indexOf(name);
  if(i>=0)arr.splice(i,1);else arr.push(name);
  m.attendees=arr.join(', ');
  save();render();
}
function updAgenda(i,k,v){
  const m=curMeet();if(!m||!m.agenda[i])return;
  m.agenda[i][k]=v;save();state._focus='agi_'+i+'_'+k;render();
}
function delAgendaRow(i){const m=curMeet();if(!m)return;m.agenda.splice(i,1);save();render()}
function addAgendaRow(){
  const m=curMeet();if(!m)return;
  const tEl=document.getElementById('agT');
  const topic=tEl?tEl.value.trim():'';
  if(!topic){toast('Укажите вопрос повестки');return}
  const sEl=document.getElementById('agS');
  const rEl=document.getElementById('agR');
  m.agenda.push({topic:topic,speaker:sEl?sEl.value.trim():'',reglament:rEl?rEl.value.trim():''});
  save();render();
}
function meetGrp(id){state.meetGroup=id==='all'?'all':'grp_'+id;state.meetSel=[];render()}
function setMeetQ(v){state.meetQ=v;state._focus='meetQ';render()}
function meetAvail(m){
  const ids=m.taskIds||[];
  const q=(state.meetQ||'').toLowerCase();
  const g=state.meetGroup!=='all'?byId(db.taskGroups,state.meetGroup.slice(4)):null;
  return db.tasks.filter(t=>!ids.includes(t.id)&&(!g||matchGroup(t,g))&&(!q||((t.title||'')+' '+(t.executor||'')).toLowerCase().indexOf(q)>=0))
    .sort((a,b)=>(a.deadline||'9999').localeCompare(b.deadline||'9999'));
}
function toggleSel(tid){
  state.meetSel=state.meetSel||[];
  const i=state.meetSel.indexOf(tid);
  if(i>=0)state.meetSel.splice(i,1);else state.meetSel.push(tid);
  render();
}
function selAllMeet(){
  const m=curMeet();if(!m)return;
  const avail=meetAvail(m);
  const set=new Set((state.meetSel||[]).concat(avail.map(t=>t.id)));
  state.meetSel=Array.from(set);
  render();
}
function addSelToMeet(){
  const m=curMeet();if(!m)return;
  m.taskIds=m.taskIds||[];
  let n=0;(state.meetSel||[]).forEach(id=>{if(!m.taskIds.includes(id)){m.taskIds.push(id);n++}});
  state.meetSel=[];
  save();render();
  toast(n?'Вынесено на совещание задач: '+n:'Задачи не добавлены');
}
function toggleMeetTask(mid,tid){
  const m=byId(db.meetings,mid);if(!m)return;
  m.taskIds=m.taskIds||[];
  const i=m.taskIds.indexOf(tid);
  if(i>=0)m.taskIds.splice(i,1);else m.taskIds.push(tid);
  save();render();
}
function meetTaskDoneE(tid,checked){
  const t=byId(db.tasks,tid);if(!t)return;
  t.status=checked?'done':'progress';
  t.statusDate=todayISO();
  syncWfFromTask(t);
  save();render();
  toast(checked?'Задача исполнена — этап её workflow закрыт':'Отметка исполнения снята');
}
function updDecision(i,k,v){
  const m=curMeet();if(!m||!m.decisions[i])return;
  m.decisions[i][k]=v;save();state._focus='dci_'+i+'_'+k;render();
}
function delDecisionRow(i){const m=curMeet();if(!m)return;m.decisions.splice(i,1);save();render()}
function toggleDecisionRow(i){
  const m=curMeet();if(!m||!m.decisions[i])return;
  m.decisions[i].status=m.decisions[i].status==='done'?'open':'done';
  save();render();
}
function addDecisionRow(){
  const m=curMeet();if(!m)return;
  const tEl=document.getElementById('dcT');
  const text=tEl?tEl.value.trim():'';
  if(!text){toast('Укажите текст решения');return}
  const eEl=document.getElementById('dcE');
  const dEl=document.getElementById('dcD');
  m.decisions.push({text:text,executor:eEl?eEl.value.trim():'',deadline:dEl?dEl.value:'',projectId:m.projectId||'',status:'open'});
  save();render();
}
function taskFromDecisionRow(i){
  const m=curMeet();if(!m||!m.decisions[i])return;
  const dc=m.decisions[i];
  db.tasks.unshift({id:uid(),title:'Поручение: '+dc.text,executor:dc.executor,deadline:dc.deadline,
    projectId:dc.projectId||m.projectId||'',status:firstKey('task'),statusDate:todayISO(),priority:'high',
    desc:'По протоколу № '+(m.num||'б/н')+' от '+fmt(m.date),wf:null});
  save();render();toast('Задача создана по решению совещания ✔');
}
function signProtocol(){
  const m=curMeet();if(!m)return;
  m.status='signed';m.statusDate=todayISO();
  save();render();toast('Протокол подписан ✒️');
}

function tbl(hs,rows){
  let h='<table><thead><tr>';
  hs.forEach(x=>{h+='<th>'+x+'</th>'});
  h+='</tr></thead><tbody>';
  if(rows.length){rows.forEach(r=>{h+='<tr>';r.forEach(c=>{h+='<td>'+(c!=null?c:'—')+'</td>'});h+='</tr>'})}
  else h+='<tr><td colspan="'+hs.length+'">нет данных</td></tr>';
  return h+'</tbody></table>';
}

      +'<h3 style="margin-bottom:4px">Добавить сотрудника / исполнителя</h3>'
      +'<div style="color:var(--muted);font-size:12.5px;margin-bottom:8px">Список используется во всех модулях для полей «Исполнитель», «Руководитель», «Председатель» и т.п.</div>'
      +'<div class="frow3"><div><label>ФИО</label><input id="ppName" placeholder="Иванов И.И."></div>'
      +'<div><label>Должность / роль</label><input id="ppRole" placeholder="Ведущий специалист"></div>'
      +'<button class="btn primary" onclick="addPerson()">Добавить</button></div>'
      +'</div>'
      +'<div class="card" style="max-width:760px;overflow-x:auto">';
    if(db.people.length){
      body+='<table class="tbl"><thead><tr><th>Сотрудник</th><th>Должность</th><th>Задач</th><th></th></tr></thead><tbody>';
      db.people.forEach(p=>{
        body+='<tr><td class="nm">'+esc(p.name)+'</td><td style="font-size:12.5px">'+esc(p.role||'—')+'</td>'
          +'<td><span class="lchip">'+db.tasks.filter(x=>x.executor===p.name).length+'</span></td>'
          +'<td style="white-space:nowrap"><button class="icobtn" onclick="personModal(\''+p.id+'\')">✏️</button><button class="icobtn" onclick="delPerson(\''+p.id+'\')">🗑</button></td></tr>';
      });
      body+='</tbody></table>';
    } else body+='<div class="empty">👥<p>Список пуст</p></div>';
    body+='</div>';
  }
  if(tab==='statuses'){
    const SETS=[['project','🗂 Статусы проектов'],['task','✅ Статусы задач'],['grant','💰 Статусы грантов'],['schol','🎓 Статусы стипендий'],['meet','🤝 Статусы совещаний']];
    body+='<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(360px,1fr));gap:16px">';
    SETS.forEach(pair=>{
      const set=pair[0],label=pair[1];
      body+='<div class="card pad"><h3 style="margin-bottom:12px">'+label+'</h3>';
      (db.statusSets[set]||[]).forEach(s=>{
        body+='<div class="row-item" style="padding:9px 12px">'
          +'<span class="badge '+s.color+'">'+esc(s.label)+'</span>'
          +'<span class="ri-s" style="margin-left:4px">используется: '+stUsage(set,s.key)+'</span>'
          +'<span style="flex:1"></span>'
          +'<button class="icobtn" onclick="statusModal(\''+set+'\',\''+s.key+'\')">✏️</button>'
          +'<button class="icobtn" onclick="delStatus(\''+set+'\',\''+s.key+'\')">🗑</button></div>';
      });
      let colOpts='';COLORS.forEach(c=>{colOpts+='<option value="'+c[0]+'">'+c[1]+'</option>'});
      body+='<div class="mini-add" style="margin-top:10px">'
        +'<div class="frow3" style="grid-template-columns:1fr 150px auto">'
        +'<div><label>Новый статус</label><input id="stN_'+set+'" placeholder="Название"></div>'
        +'<div><label>Цвет</label><select id="stC_'+set+'">'+colOpts+'</select></div>'
        +'<button class="btn primary sm" onclick="addStatusFromUI(\''+set+'\')">＋</button>'
        +'</div></div></div>';
    });
    body+='</div>';
  }
  if(tab==='doctypes'){
    body+=typesTabCard('Типы документов','Тип документа','Например: Акт','addDocType','delDocType',db.docTypes);
  }
  if(tab==='softtypes'){
    body+=typesTabCard('Типы программного обеспечения','Тип ПО','Например: Микросервис','addSoftType','delSoftType',db.softTypes);
  }
  if(tab==='scholtypes'){
    body+=typesTabCard('Типы стипендий','Тип стипендии','Например: Губернаторская','addScholType','delScholType',db.scholTypes);
  }
  if(tab==='prio'){
    body+='<div class="card pad" style="max-width:640px"><h3 style="margin-bottom:12px">Приоритеты задач</h3>';
    db.prioSet.forEach(s=>{
      body+='<div class="row-item" style="padding:9px 12px">'
        +'<span class="badge '+s.color+'">'+esc(s.label)+'</span>'
        +'<span class="ri-s" style="margin-left:4px">используется: '+stUsage('prio',s.key)+'</span>'
        +'<span style="flex:1"></span>'
        +'<button class="icobtn" onclick="prioKeyModal(\''+s.key+'\')">✏️</button>'
        +'<button class="icobtn" onclick="delPrioKey(\''+s.key+'\')">🗑</button></div>';
    });
    let colOpts='';COLORS.forEach(c=>{colOpts+='<option value="'+c[0]+'">'+c[1]+'</option>'});
    body+='<div class="mini-add" style="margin-top:10px">'
      +'<div class="frow3" style="grid-template-columns:1fr 150px auto">'
      +'<div><label>Новый приоритет</label><input id="prN" placeholder="Название"></div>'
      +'<div><label>Цвет</label><select id="prC">'+colOpts+'</select></div>'
      +'<button class="btn primary sm" onclick="addPrioKey()">＋</button>'
      +'</div></div></div>';
  }
  if(tab==='wf'){
    body+='<div style="margin-bottom:14px"><button class="btn primary" onclick="wfFormModal()">＋ Шаблон маршрута</button></div><div class="cards">';
    if(db.wfTemplates.length){
      db.wfTemplates.forEach(tp=>{
        body+='<div class="card pad"><div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px"><h3>'+esc(tp.name)+'</h3>'
          +'<div style="white-space:nowrap"><button class="icobtn" onclick="wfFormModal(\''+tp.id+'\')">✏️</button><button class="icobtn" onclick="deleteWf(\''+tp.id+'\')">🗑</button></div></div>'
          +'<div class="link-chips" style="margin-top:12px">'+tp.steps.map((s,i)=>'<span class="lchip">'+(i+1)+'. '+esc(s)+'</span>').join(' → ')+'</div>'
          +'<div style="color:var(--muted);font-size:12px;margin-top:12px">Используется в документах/проектах/ПО: '+[...db.docs,...db.projects,...db.softs].filter(x=>x.templateName===tp.name).length+'</div></div>';
      });
    } else body+='<div class="empty" style="grid-column:1/-1">🧭<p>Шаблонов нет</p></div>';
    body+='</div>';
  }
  if(tab==='groups'){
    body+='<div class="card pad" style="max-width:760px">'
      +'<h3 style="margin-bottom:4px">Группы задач для совещаний</h3>'
      +'<div style="color:var(--muted);font-size:12.5px;margin-bottom:12px">В конструкторе можно выбирать несколько значений в каждом параметре (например «В работе» и «Выполненные»). Внутри параметра — «ИЛИ», между параметрами — «И».</div>'
      +grpListHTML()
      +'<div style="margin-top:14px"><button class="btn primary" onclick="grpFormModal()">＋ Новая группа</button></div>'
      +'</div>';
  }
  document.getElementById('content').innerHTML=body;
}
function typesTabCard(title,lbl,ph,addFn,delFn,arr){
  let h='<div class="card pad" style="max-width:760px"><h3 style="margin-bottom:12px">'+title+'</h3><div class="link-chips" style="gap:8px">';
  arr.forEach(tp=>{h+='<span class="lchip" style="font-size:13px;padding:7px 13px">'+esc(tp)+' <b style="cursor:pointer;color:var(--red);margin-left:4px" onclick="'+delFn+'(\''+esc(tp)+'\')">✕</b></span>'});
  h+='</div><div class="mini-add" style="margin-top:14px"><div class="frow3" style="grid-template-columns:1fr auto">'
    +'<div><label>'+lbl+'</label><input id="typeNew" placeholder="'+ph+'"></div>'
    +'<button class="btn primary" onclick="'+addFn+'()">Добавить</button></div></div></div>';
  return h;
}
function readTypeNew(){const el=document.getElementById('typeNew');return el?el.value.trim():''}
function addPerson(){
  const name=document.getElementById('ppName').value.trim();
  const role=document.getElementById('ppRole').value.trim();
  if(!name){toast('Укажите ФИО');return}
  db.people.push({id:uid(),name:name,role:role});
  save();render();toast('Сотрудник добавлен');
}
function personModal(id){
  const p=byId(db.people,id);if(!p)return;
  openModal('Редактирование сотрудника',
    '<label>ФИО</label><input name="name" required value="'+esc(p.name)+'">'
    +'<label>Должность / роль</label><input name="role" value="'+esc(p.role||'')+'">'
    +'<p style="font-size:12px;color:var(--muted);margin-top:12px">⚠️ Изменение ФИО не обновляет уже введённые значения в задачах и документах.</p>',
    'Сохранить',fd=>{p.name=fd.name.trim();p.role=(fd.role||'').trim();save();closeModal();render();toast('Сохранено')});
}
function delPerson(id){
  const p=byId(db.people,id);if(!p)return;
  askConfirm('Удалить сотрудника «'+esc(p.name)+'» из справочника?','Удалить',()=>{
    db.people=db.people.filter(x=>x.id!==id);save();render();toast('Сотрудник удалён');
  });
}
function addStatusFromUI(set){
  const el=document.getElementById('stN_'+set);
  const label=el?el.value.trim():'';
  const color=document.getElementById('stC_'+set).value;
  if(!label){toast('Укажите название статуса');return}
  db.statusSets[set].push({key:uid(),label:label,color:color});
  save();render();toast('Статус добавлен');
}
function statusModal(set,key){
  const s=(db.statusSets[set]||[]).find(x=>x.key===key);if(!s)return;
  let colOpts='';COLORS.forEach(c=>{colOpts+='<option value="'+c[0]+'" '+(s.color===c[0]?'selected':'')+'>'+c[1]+'</option>'});
  openModal('Редактирование статуса',
    '<label>Название</label><input name="label" required value="'+esc(s.label)+'">'
    +'<label>Цвет</label><select name="color">'+colOpts+'</select>',
    'Сохранить',fd=>{s.label=fd.label.trim();s.color=fd.color;save();closeModal();render();toast('Статус обновлён')});
}
function delStatus(set,key){
  const used=stUsage(set,key);
  if(used>0){toast('Нельзя удалить: статус используется в объектах ('+used+')');return}
  askConfirm('Удалить статус?','Удалить',()=>{
    db.statusSets[set]=db.statusSets[set].filter(s=>s.key!==key);
    save();render();toast('Статус удалён');
  });
}
function addPrioKey(){
  const el=document.getElementById('prN');
  const label=el?el.value.trim():'';
  const color=document.getElementById('prC').value;
  if(!label){toast('Укажите название приоритета');return}
  db.prioSet.push({key:uid(),label:label,color:color});
  save();render();toast('Приоритет добавлен');
}
function prioKeyModal(key){
  const s=db.prioSet.find(x=>x.key===key);if(!s)return;
  let colOpts='';COLORS.forEach(c=>{colOpts+='<option value="'+c[0]+'" '+(s.color===c[0]?'selected':'')+'>'+c[1]+'</option>'});
  openModal('Редактирование приоритета',
    '<label>Название</label><input name="label" required value="'+esc(s.label)+'">'
    +'<label>Цвет</label><select name="color">'+colOpts+'</select>',
    'Сохранить',fd=>{s.label=fd.label.trim();s.color=fd.color;save();closeModal();render();toast('Приоритет обновлён')});
}
function delPrioKey(key){
  const used=stUsage('prio',key);
  if(used>0){toast('Нельзя удалить: приоритет используется в задачах ('+used+')');return}
  askConfirm('Удалить приоритет?','Удалить',()=>{
    db.prioSet=db.prioSet.filter(s=>s.key!==key);save();render();toast('Приоритет удалён');
  });
}
function addDocType(){const v=readTypeNew();if(!v){toast('Укажите тип');return}if(db.docTypes.indexOf(v)>=0){toast('Такой тип уже есть');return}db.docTypes.push(v);save();render();toast('Тип документа добавлен')}
function delDocType(tp){const used=db.docs.filter(d=>d.type===tp).length;if(used){toast('Нельзя удалить: используется в документах ('+used+')');return}db.docTypes=db.docTypes.filter(x=>x!==tp);save();render();toast('Тип удалён')}
function addSoftType(){const v=readTypeNew();if(!v){toast('Укажите тип');return}if(db.softTypes.indexOf(v)>=0){toast('Такой тип уже есть');return}db.softTypes.push(v);save();render();toast('Тип ПО добавлен')}
function delSoftType(tp){const used=db.softs.filter(s=>s.type===tp).length;if(used){toast('Нельзя удалить: используется в ПО ('+used+')');return}db.softTypes=db.softTypes.filter(x=>x!==tp);save();render();toast('Тип удалён')}
function addScholType(){const v=readTypeNew();if(!v){toast('Укажите тип');return}if(db.scholTypes.indexOf(v)>=0){toast('Такой тип уже есть');return}db.scholTypes.push(v);save();render();toast('Тип стипендии добавлен')}
function delScholType(tp){const used=db.schols.filter(s=>s.type===tp).length;if(used){toast('Нельзя удалить: используется в стипендиях ('+used+')');return}db.scholTypes=db.scholTypes.filter(x=>x!==tp);save();render();toast('Тип удалён')}
function wfFormModal(id){
  const tp=id?byId(db.wfTemplates,id):null;
  openModal(tp?'Редактирование шаблона':'Новый шаблон маршрута',
    '<label>Наименование шаблона *</label><input name="name" required value="'+esc(tp?tp.name:'')+'">'
    +'<label>Этапы (каждый с новой строки)</label><textarea name="stepsText" rows="6" required>'+esc(tp?tp.steps.join('\n'):['Подготовка','Согласование','Подписание'].join('\n'))+'</textarea>'
    +'<p style="font-size:12px;color:var(--muted);margin-top:10px">Ответвления создаются на холсте маршрута конкретного документа, проекта или ПО.</p>',
    'Сохранить',fd=>{
      const steps=(fd.stepsText||'').split('\n').map(s=>s.trim()).filter(Boolean);
      if(!steps.length){toast('Добавьте хотя бы один этап');return}
      if(tp){tp.name=fd.name.trim();tp.steps=steps}else db.wfTemplates.push({id:uid(),name:fd.name.trim(),steps:steps});
      save();closeModal();render();toast('Шаблон сохранён');
    });
}
function deleteWf(id){
  askConfirm('Удалить шаблон маршрута? Объекты, созданные по нему, сохранят свои этапы.','Удалить',()=>{
    db.wfTemplates=db.wfTemplates.filter(x=>x.id!==id);save();render();toast('Шаблон удалён');
  });
}
/* ================= ЭКСПОРТ / ИМПОРТ ================= */
function exportJSON(){
  const blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='caesar_'+todayISO()+'.json';a.click();
  toast('Данные экспортированы в JSON 💾');
}
function importJSON(){document.getElementById('fileInput').click()}
document.getElementById('fileInput').addEventListener('change',e=>{
  const f=e.target.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=()=>{
    try{
      const p=JSON.parse(r.result);
      const base=defaults();
      Object.keys(base).forEach(k=>{if(p[k]!==undefined)base[k]=p[k]});
      db=base;normalizeDB();save();render();toast('Данные импортированы ✔');
    }catch(err){toast('Ошибка чтения файла')}
  };
  r.readAsText(f);e.target.value='';
});
function resetAll(){
  askConfirm('Очистить все данные и вернуть систему к чистому состоянию? Справочники будут восстановлены по умолчанию.','Очистить',()=>{
    db=defaults();save();render();toast('Система очищена ♻️');
  });
}
/* ================= INIT ================= */
load();
render();
setTimeout(()=>{
  const sp=document.getElementById('splash');
  if(sp){sp.classList.add('hide');setTimeout(()=>sp.remove(),550)}
},750);
</script>
</body>
